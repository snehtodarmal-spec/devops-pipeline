services:

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: jenkins/jenkins:lts
    container_name: jenkins
    privileged: true
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount plugins.txt so the entrypoint script auto-installs plugins
      - ./plugins.txt:/usr/share/jenkins/ref/plugins.txt:ro
      # Mount casc.yaml — JCasC reads this path on startup
      - ./casc.yaml:/var/jenkins_home/casc.yaml:ro
      - ./ssh_keys/ec2-key.pem:/var/jenkins_home/ec2-key.pem:ro
    environment:
      # Tell JCasC plugin where to find the config file
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc.yaml

      # Skip the setup wizard entirely — JCasC handles all setup
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false

      # Secrets — set these in your .env file (gitignored)
      # docker-compose automatically reads .env from the same directory
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD}
      - SONAR_TOKEN=${SONAR_TOKEN}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - SONARQUBE_URL=http://sonarqube:9000
      - DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}
      - DOCKERHUB_TOKEN=${DOCKERHUB_TOKEN}
    networks:
      - cicd-net
    restart: unless-stopped

volumes:
  jenkins_home:

networks:
  cicd-net:
    driver: bridge
